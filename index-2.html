<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظرسنجی عمومی</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
  }
  .container {
    width: min(760px, calc(100% - 28px));
    margin: 40px auto;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  h1 { margin-bottom: 8px; }
  .subtitle { color: #6b7280; }
  .card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
  }
  textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 14px;
    font: inherit;
    outline: none;
  }
  textarea:focus { border-color: #6366f1; }
  .submit {
    width: 100%;
    margin-top: 12px;
    padding: 13px;
    border: 0;
    border-radius: 12px;
    background: #4f46e5;
    color: white;
    font: inherit;
    cursor: pointer;
  }
  .submit:hover { background: #4338ca; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 24px 0 12px;
  }
  .sort {
    border: 1px solid #d1d5db;
    border-radius: 9px;
    padding: 8px;
    background: white;
  }
  .opinion {
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 16px;
    margin-top: 12px;
  }
  .opinion-text {
    white-space: pre-wrap;
    line-height: 1.8;
    margin-bottom: 12px;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #6b7280;
    font-size: 13px;
  }
  .like {
    border: 1px solid #e5e7eb;
    background: #fff;
    border-radius: 10px;
    padding: 8px 12px;
    cursor: pointer;
    font: inherit;
  }
  .like:hover { background: #f3f4f6; }
  .empty {
    text-align: center;
    color: #6b7280;
    padding: 25px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🗳️ نظرسنجی عمومی</h1>
    <div class="subtitle">نظرت را بنویس؛ نظرات محبوب‌تر بالاتر نمایش داده می‌شوند.</div>
  </header>

  <section class="card">
    <div id="welcome" style="margin-bottom:14px;font-weight:bold;"></div>
    <textarea id="opinionInput" maxlength="1000"
      placeholder="نظر خودت را اینجا بنویس..."></textarea>
    <button class="submit" id="submitBtn">ثبت نظر</button>
  </section>

  <div class="toolbar">
    <strong id="count">نظرات</strong>
    <select class="sort" id="sort">
      <option value="likes">محبوب‌ترین</option>
      <option value="newest">جدیدترین</option>
    </select>
  </div>

  <section id="opinions"></section>
</div>

<script>
  const STORAGE_KEY = "survey-opinions-v1";
  const NAME_KEY = "survey-user-name-v1";

  let opinions = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  let userName = localStorage.getItem(NAME_KEY) || "";

  const input = document.getElementById("opinionInput");
  const list = document.getElementById("opinions");
  const count = document.getElementById("count");
  const sort = document.getElementById("sort");
  const welcome = document.getElementById("welcome");

  function askForName() {
    if (userName) {
      welcome.textContent = `سلام ${userName} 👋 نظرت رو بنویس:`;
      return;
    }

    let name = "";
    while (!name) {
      name = prompt("سلام 👋 اسم شما چیه؟");
      if (name === null) {
        name = "کاربر";
        break;
      }
      name = name.trim();
      if (!name) alert("لطفاً اسمت رو وارد کن.");
    }

    userName = name.slice(0, 50);
    localStorage.setItem(NAME_KEY, userName);
    welcome.textContent = `سلام ${userName} 👋 نظرت رو بنویس:`;
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(opinions));
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function render() {
    const sorted = [...opinions];

    if (sort.value === "likes") {
      sorted.sort((a, b) => b.likes - a.likes || b.createdAt - a.createdAt);
    } else {
      sorted.sort((a, b) => b.createdAt - a.createdAt);
    }

    count.textContent = `${opinions.length} نظر`;

    if (!sorted.length) {
      list.innerHTML = '<div class="card empty">هنوز نظری ثبت نشده است. اولین نظر را تو بنویس! 👇</div>';
      return;
    }

    list.innerHTML = sorted.map(opinion => `
      <article class="opinion">
        <div class="opinion-text">${escapeHtml(opinion.text)}</div>
        <div class="meta">
          <span>👤 ${escapeHtml(opinion.name || "کاربر")} · ${new Date(opinion.createdAt).toLocaleString("fa-IR")}</span>
          <button class="like" onclick="likeOpinion('${opinion.id}')">
            👍 ${opinion.likes}
          </button>
        </div>
      </article>
    `).join("");
  }

  function addOpinion() {
    const text = input.value.trim();

    if (!text) {
      alert("لطفاً اول نظرت را بنویس.");
      return;
    }

    opinions.push({
      id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
      text,
      name: userName,
      likes: 0,
      createdAt: Date.now()
    });

    input.value = "";
    save();
    render();
  }

  window.likeOpinion = function(id) {
    const opinion = opinions.find(item => item.id === id);
    if (!opinion) return;

    opinion.likes++;
    save();
    render();
  };

  askForName();
  document.getElementById("submitBtn").addEventListener("click", addOpinion);
  sort.addEventListener("change", render);

  input.addEventListener("keydown", event => {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
      addOpinion();
    }
  });

  render();
</script>
</body>
</html>
