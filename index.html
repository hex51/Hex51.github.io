<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلام دنیا | امیرحسین</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Tahoma, Arial, sans-serif; color: #fff;
      background: linear-gradient(135deg, #101827, #1d4ed8);
    }
    main {
      width: min(90%, 680px); padding: 56px 24px; text-align: center;
      border: 1px solid rgba(255,255,255,.2); border-radius: 28px;
      background: rgba(255,255,255,.10); backdrop-filter: blur(12px);
      box-shadow: 0 24px 70px rgba(0,0,0,.25);
    }
    h1 { margin: 0 0 16px; font-size: clamp(2rem, 7vw, 4rem); }
    p { margin: 0; color: #dbeafe; font-size: 1.15rem; }
    .spark { display: block; margin-bottom: 22px; font-size: 2.5rem; }
  </style>
</head>
<body>
  <main>
    <span class="spark">👋</span>
    <h1>سلام دنیا از طرف امیرحسین</h1>
    <p>اولین سایت من با کمک هوش مصنوعی 🚀</p>
  </main>
</body>
</html>
